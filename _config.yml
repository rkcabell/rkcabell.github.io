title: Ryan Cabell
description: Professional Software Developer
show_downloads: true
baseurl:
google_analytics:
theme: jekyll-theme-cayman
categories: [root, world, gallery, project, protected, homepage]
collections:
  chapters:
    output: true
    sort_by: order
    permalink: /:collection/:name
  eras:
    output: true
    sort_by: order
    permalink: /:collection/:name
  environments:
    output: true
    permalink: /:collection/:name
  habitals:
    output: true
    permalink: /:collection/:name
  projects:
    output: true
    sort_by: order
    permalink: /:collection/:name/
paginate: 25
paginate_path: '/page:num/'
defaults:
  - scope:
      path: "pages/personal"
      type: "pages"
    values:
      audience: personal
      section: personal
      layout: personal_homepage
  - scope:
      path: ""
      type: "projects"
    values:
      layout: project
